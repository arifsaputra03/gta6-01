<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Heat — a 2D top-down open-world crime story. Drive, steal cars, outrun the Solmar PD and pay back a $50,000 debt across eight missions.">
<title>Solmar Heat — an open-world crime story</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  /* Read aloud, never shown: the status line for screen readers. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Self-test output (?test=1): the machine-readable results, kept out of the way. */
  #test-result { position: absolute; left: 8px; bottom: 8px; max-width: 640px; max-height: 240px; overflow: auto;
    margin: 0; padding: 8px; background: rgba(0,0,0,0.75); color: #7ee787; font: 11px/1.4 monospace; white-space: pre-wrap; }
  #test-result:empty { display: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Solmar Heat: a top-down open-world crime game. Drive, steal cars, outrun the Solmar police and pay back a $50,000 debt across eight missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="test-result"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
